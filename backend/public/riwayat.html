<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Riwayat Obrolan — Ardena AI Scratch 3</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#005db6",
            "primary-fixed": "#d6e3ff",
            "scratch-motion": "#4C97FF",
            "scratch-looks": "#9966FF",
            "scratch-sound": "#CF63CF",
            "scratch-events": "#FFBF00",
            "scratch-control": "#FFAB19",
            "scratch-operators": "#59C059",
            "canvas-panel": "#E9F1FC",
            "stage-bg": "#F9F9F9",
            "on-surface": "#0d1c32",
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
          },
          fontFamily: {
            sans: ["Nunito Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-stage-bg font-sans text-on-surface min-h-screen">
  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-scratch-motion text-white shadow-md">
    <div class="h-20 max-w-5xl mx-auto px-4 sm:px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-scratch-motion text-[28px]">history</span>
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-extrabold">Riwayat Obrolan</span>
          <span class="text-xs text-primary-fixed">Catatan Belajar Scratch 3 Kamu</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a class="px-4 py-2 rounded-xl bg-white text-primary font-bold text-sm shadow-sm hover:brightness-105 transition-all flex items-center gap-1.5" href="chat.html">
          <span class="material-symbols-outlined text-[18px]">add_comment</span>
          <span>Tanya Baru</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Container -->
  <main class="w-full pt-28 pb-16 px-4 sm:px-6 max-w-5xl mx-auto flex flex-col gap-6">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-extrabold text-on-surface">Daftar Obrolan Sebelumnya</h1>
      <button class="text-xs font-bold text-primary flex items-center gap-1 hover:underline" onclick="loadConversations()">
        <span class="material-symbols-outlined text-[16px]">refresh</span>
        Perbarui
      </button>
    </div>

    <!-- Conversations List Container -->
    <div class="flex flex-col gap-4" id="conversationsContainer">
      <div class="p-8 text-center bg-white rounded-2xl shadow-sm text-gray-500 font-semibold" id="loadingState">
        <span class="material-symbols-outlined text-[32px] animate-spin text-primary">sync</span>
        <p class="mt-2 text-sm">Sedang memuat riwayat belajarmu...</p>
      </div>
    </div>
  </main>

  <script>
    const AUTH_TOKEN = localStorage.getItem('ardena_auth_token') || 'dev_siswa_andi';

    async function loadConversations() {
      const container = document.getElementById('conversationsContainer');
      container.innerHTML = `
        <div class="p-8 text-center bg-white rounded-2xl shadow-sm text-gray-500 font-semibold">
          <span class="material-symbols-outlined text-[32px] animate-spin text-primary">sync</span>
          <p class="mt-2 text-sm">Sedang memuat riwayat belajarmu...</p>
        </div>
      `;

      try {
        const res = await fetch('api/conversations.php', {
          headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
        });
        const json = await res.json();

        if (json.success && json.data.conversations && json.data.conversations.length) {
          container.innerHTML = json.data.conversations.map(c => `
            <div class="p-5 bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:shadow-md transition-all">
              <div class="flex items-start gap-4">
                <div class="w-12 h-12 rounded-xl bg-primary-fixed/40 text-primary flex items-center justify-center flex-shrink-0">
                  <span class="material-symbols-outlined text-[24px]">chat</span>
                </div>
                <div class="flex flex-col gap-1">
                  <h3 class="text-lg font-bold text-on-surface">${escapeHtml(c.title)}</h3>
                  <p class="text-xs text-gray-500 line-clamp-1">${escapeHtml(c.preview || 'Percakapan Scratch 3')}</p>
                  <span class="text-[11px] text-gray-400 mt-1">${new Date(c.updated_at).toLocaleString('id-ID')} • ${c.total_messages || 0} Pesan</span>
                </div>
              </div>
              <div class="flex items-center gap-2 self-end sm:self-center">
                <a href="chat.html?id=${encodeURIComponent(c.id)}" class="px-4 py-2 rounded-xl bg-scratch-motion text-white text-xs font-bold shadow-sm hover:brightness-105">
                  Buka
                </a>
                <button onclick="deleteConversation('${escapeHtml(c.id)}')" class="w-8 h-8 rounded-xl bg-red-50 text-error flex items-center justify-center hover:bg-red-100" title="Hapus">
                  <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div class="p-12 text-center bg-white rounded-2xl shadow-sm text-gray-500 flex flex-col items-center gap-3">
              <span class="material-symbols-outlined text-[48px] text-scratch-events">sentiment_satisfied</span>
              <p class="text-base font-bold text-on-surface">Belum ada riwayat obrolan</p>
              <p class="text-xs text-gray-400 max-w-sm">Kamu belum memulai percakapan dengan Ardena. Yuk klik tombol di bawah untuk bertanya!</p>
              <a href="chat.html" class="mt-2 px-5 py-2.5 rounded-xl bg-scratch-motion text-white font-bold text-sm shadow-md">
                Mulai Tanya Ardena
              </a>
            </div>
          `;
        }
      } catch (e) {
        container.innerHTML = `<div class="p-6 bg-red-50 text-error rounded-2xl font-bold text-sm">Gagal memuat riwayat. Pastikan backend aktif.</div>`;
      }
    }

    async function deleteConversation(id) {
      if (!confirm("Apakah kamu yakin ingin menghapus obrolan ini?")) return;

      try {
        const res = await fetch(`api/conversation-delete.php?id=${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
        });
        const json = await res.json();
        if (json.success) {
          loadConversations();
        } else {
          alert(json.error?.message || "Gagal menghapus obrolan.");
        }
      } catch (e) {
        alert("Gagal menghapus obrolan.");
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text || '';
      return div.innerHTML;
    }

    loadConversations();
  </script>
</body>
</html>
